<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8651b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Pantry">
<title>My Pantry</title>
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: Arial, sans-serif; margin: 0; background: #f6f1ea; color: #333; -webkit-tap-highlight-color: transparent; overflow-x: hidden; padding-bottom: env(safe-area-inset-bottom); }
  button, input, select, textarea { touch-action: manipulation; font-family: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: #c8651b; color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 14px; text-align: center; font-size: 22px; font-weight: bold; }

  .addwrap { background: #fff; }
  .add { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; max-width: 720px; margin: 0 auto; }
  .add input, .add select { width: 100%; min-height: 46px; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
  #name, .full, .primary, .fld { grid-column: 1 / -1; }
  .fld { display: grid; gap: 4px; font-size: 13px; color: #666; }
  .primary { min-height: 48px; padding: 10px 18px; font-size: 17px; font-weight: bold; background: #c8651b; color: #fff; border: none; border-radius: 8px; }

  .tools { display: flex; gap: 8px; padding: 10px 12px 0; flex-wrap: wrap; max-width: 720px; margin: 0 auto; }
  .tools input[type=text] { flex: 1 1 100%; min-height: 46px; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  .tools select { flex: 1 1 150px; min-height: 44px; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
  .tools button { flex: 1 1 auto; min-height: 44px; padding: 10px 14px; font-size: 15px; background: #fff; color: #c8651b; border: 1px solid #c8651b; border-radius: 8px; }
  .filter { padding: 10px 12px 0; font-size: 15px; max-width: 720px; margin: 0 auto; }
  .filter label { display: flex; align-items: center; gap: 8px; min-height: 36px; }
  .filter input { width: 22px; height: 22px; flex-shrink: 0; }

  .alertwrap { padding: 10px 12px 0; max-width: 720px; margin: 0 auto; }
  #alertBar { display: none; padding: 10px 12px; border-radius: 8px; font-size: 15px; font-weight: bold; color: #fff; }
  #alertBar.red { background: #c0392b; }
  #alertBar.orange { background: #e67e22; }

  #list { padding: 12px; display: grid; gap: 10px; max-width: 720px; margin: 0 auto; }
  .item { display: flex; align-items: center; gap: 12px; background: #fff; padding: 10px; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .item.expired { background: #fdecea; }
  .item.soon { background: #fff4e5; }
  .item.lowstock { border-left: 6px solid #e67e22; }
  .item.out { border-left: 6px solid #c0392b; }
  .thumb { width: 64px; height: 64px; border-radius: 8px; background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #888; cursor: pointer; overflow: hidden; flex-shrink: 0; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .info { flex: 1; min-width: 0; }
  .iname { font-size: 18px; font-weight: bold; overflow-wrap: anywhere; }
  .meta { font-size: 13px; color: #777; overflow-wrap: anywhere; }
  .note { font-size: 13px; color: #555; font-style: italic; margin-top: 2px; overflow-wrap: anywhere; }
  .warn { font-size: 13px; font-weight: bold; }
  .warn.low { color: #e67e22; }
  .warn.out { color: #c0392b; }
  .pill { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
  .pill.red { background: #c0392b; color: #fff; }
  .pill.orange { background: #e67e22; color: #fff; }
  .pill.yellow { background: #f1c40f; color: #333; }
  .pill.grey { background: #eee; color: #666; }
  .ctrl { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .step { display: flex; align-items: center; gap: 10px; }
  .step button { width: 44px; height: 44px; font-size: 24px; border: none; border-radius: 50%; background: #c8651b; color: #fff; }
  .count { min-width: 34px; text-align: center; font-size: 22px; font-weight: bold; }
  .acts { display: flex; gap: 2px; }
  .acts button { width: 44px; height: 44px; background: none; border: none; font-size: 20px; }
  .acts .edit { color: #555; }
  .acts .del { color: #c0392b; }
  .empty { text-align: center; color: #888; padding: 30px; }

  .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); z-index: 10; align-items: center; justify-content: center; padding: 16px; }
  .box { background: #fff; border-radius: 12px; padding: 16px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; display: grid; gap: 10px; }
  .box h3 { margin: 0; color: #c8651b; }
  .box label { font-size: 13px; color: #666; display: grid; gap: 4px; }
  .box input, .box select { min-height: 46px; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
  .box textarea { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; resize: vertical; }
  .box .row { display: flex; gap: 8px; }
  .box .row input { flex: 1; min-width: 0; }
  .box .row button { flex: 1; min-height: 46px; padding: 11px; font-size: 16px; border: none; border-radius: 8px; }
  .box .row .addbtn { flex: 0 0 auto; padding: 11px 18px; }
  .box .save { background: #c8651b; color: #fff; }
  .box .cancel { background: #eee; color: #333; }
  .box button.wide { min-height: 46px; padding: 11px; font-size: 16px; border: none; border-radius: 8px; }
  .box button.link { background: none; border: none; color: #c8651b; font-size: 15px; text-decoration: underline; padding: 10px; min-height: 44px; }
  .catrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
  .catrow span { flex: 1; font-size: 16px; overflow-wrap: anywhere; }
  .catrow small { color: #888; }
  .catrow button { min-height: 40px; padding: 8px 12px; font-size: 14px; border: 1px solid #c8651b; background: #fff; color: #c8651b; border-radius: 8px; }
  .catrow button.red { border-color: #c0392b; color: #c0392b; }

  @media (min-width: 640px) {
    .add { grid-template-columns: repeat(4, 1fr); }
    #name { grid-column: span 2; }
    .fld.exp { grid-column: span 2; }
    .tools input[type=text] { flex: 2 1 200px; }
  }
  @media (max-width: 480px) {
    .item { flex-wrap: wrap; }
    .ctrl { flex: 1 1 100%; border-top: 1px solid #eee; padding-top: 8px; }
    .overlay { align-items: flex-end; padding: 0; }
    .box { max-width: none; border-radius: 16px 16px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<header>My Pantry</header>

<div class="addwrap">
  <div class="add">
    <input id="name" placeholder="Item name" autocomplete="off">
    <input id="qty" type="number" inputmode="numeric" min="0" placeholder="Qty">
    <select id="unit">
      <option value="">Unit</option>
      <option>pieces</option>
      <option>packs</option>
      <option>tins</option>
      <option>bottles</option>
      <option>kg</option>
      <option>litres</option>
    </select>
    <select id="cat"></select>
    <input id="minq" type="number" inputmode="numeric" min="0" placeholder="Low at">
    <label class="fld exp">Expiry date (optional)
      <input id="exp" type="date">
    </label>
    <input id="notes" class="full" placeholder="Notes (brand, where it is kept...)" autocomplete="off">
    <button class="primary" onclick="addItem()">Add item</button>
  </div>
</div>

<div class="tools">
  <input type="text" id="search" placeholder="Search names and notes..." oninput="render()" autocomplete="off">
  <select id="catFilter" onchange="render()"></select>
  <button onclick="openCats()">Categories</button>
  <button onclick="exportData()">Export</button>
  <button onclick="document.getElementById('importPicker').click()">Import</button>
</div>
<div class="filter">
  <label><input type="checkbox" id="lowOnly" onchange="render()"> Show only low or out of stock (shopping list)</label>
  <label><input type="checkbox" id="expOnly" onchange="render()"> Show only expired or expiring within 30 days</label>
</div>

<div class="alertwrap"><div id="alertBar"></div></div>

<div id="list"></div>

<div id="editOverlay" class="overlay" onclick="if (event.target === this) { closeEdit(); }">
  <div id="editBox" class="box">
    <h3>Edit item</h3>
    <label>Name <input id="eName"></label>
    <label>Quantity <input id="eQty" type="number" inputmode="numeric" min="0"></label>
    <label>Unit
      <select id="eUnit">
        <option value="">None</option>
        <option>pieces</option>
        <option>packs</option>
        <option>tins</option>
        <option>bottles</option>
        <option>kg</option>
        <option>litres</option>
      </select>
    </label>
    <label>Category <select id="eCat"></select></label>
    <label>Low-stock level (0 turns the warning off) <input id="eMin" type="number" inputmode="numeric" min="0"></label>
    <label>Expiry date (optional) <input id="eExp" type="date"></label>
    <label>Notes <textarea id="eNotes" rows="3" placeholder="Brand, where it is kept..."></textarea></label>
    <div class="row">
      <button class="cancel" onclick="closeEdit()">Cancel</button>
      <button class="save" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<div id="catOverlay" class="overlay" onclick="if (event.target === this) { closeCats(); }">
  <div id="catBox" class="box">
    <h3>Manage categories</h3>
    <div id="catList"></div>
    <div class="row">
      <input id="newCat" placeholder="New category name" autocomplete="off">
      <button class="save addbtn" onclick="addCategory()">Add</button>
    </div>
    <button class="link" onclick="restoreDefaults()">Restore default categories</button>
    <button class="cancel wide" onclick="closeCats()">Done</button>
  </div>
</div>

<input type="file" id="filePicker" accept="image/*" style="display:none">
<input type="file" id="importPicker" accept=".json,application/json" style="display:none">

<script>
  var DEFAULT_CATS = ['Dairy', 'Tins', 'Grains', 'Spices', 'Drinks', 'Snacks', 'Frozen', 'Vegetables', 'Other'];
  var items = JSON.parse(localStorage.getItem('pantryItems') || '[]');
  var cats = JSON.parse(localStorage.getItem('pantryCats') || 'null') || DEFAULT_CATS.slice();
  var pickingFor = null;
  var editingId = null;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function syncCats() {
    items.forEach(function (it) {
      if (it.cat && cats.indexOf(it.cat) === -1) { cats.push(it.cat); }
    });
  }
  syncCats();

  function save() {
    try {
      localStorage.setItem('pantryItems', JSON.stringify(items));
      localStorage.setItem('pantryCats', JSON.stringify(cats));
    } catch (e) { alert('Storage is full. Try removing some photos.'); }
  }

  // ---------- Expiry dates ----------
  function daysLeft(dateStr) {
    var p = dateStr.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    var t = new Date();
    t = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    return Math.round((d - t) / 86400000);
  }

  function plural(n) {
    return n === 1 ? '1 day' : n + ' days';
  }

  function expiryInfo(it) {
    if (!it.exp) { return null; }
    var n = daysLeft(it.exp);
    if (n < 0) { return { cls: 'red', text: 'Expired ' + plural(-n) + ' ago' }; }
    if (n === 0) { return { cls: 'red', text: 'Expires today' }; }
    if (n <= 7) { return { cls: 'orange', text: 'Expires in ' + plural(n) }; }
    if (n <= 30) { return { cls: 'yellow', text: 'Expires in ' + plural(n) }; }
    var p = it.exp.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return { cls: 'grey', text: 'Expires ' + d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) };
  }

  function updateAlert() {
    var bar = document.getElementById('alertBar');
    var expired = 0, soon = 0;
    items.forEach(function (it) {
      if (!it.exp) { return; }
      var d = daysLeft(it.exp);
      if (d < 0) { expired++; } else if (d <= 7) { soon++; }
    });
    var parts = [];
    if (expired) { parts.push(expired + ' expired'); }
    if (soon) { parts.push(soon + ' expiring within 7 days'); }
    if (!parts.length) { bar.style.display = 'none'; return; }
    bar.textContent = parts.join('  |  ');
    bar.className = expired ? 'red' : 'orange';
    bar.style.display = 'block';
  }

  // ---------- Category lists ----------
  function fillSelect(id, firstLabel) {
    var sel = document.getElementById(id);
    var current = sel.value;
    sel.innerHTML = '';
    var first = document.createElement('option');
    first.value = '';
    first.textContent = firstLabel;
    sel.appendChild(first);
    cats.forEach(function (c) {
      var op = document.createElement('option');
      op.value = c;
      op.textContent = c;
      sel.appendChild(op);
    });
    sel.value = cats.indexOf(current) !== -1 ? current : '';
  }

  function refreshCatSelects() {
    fillSelect('cat', 'Category');
    fillSelect('catFilter', 'All categories');
    fillSelect('eCat', 'None');
  }

  function countIn(c) {
    return items.filter(function (it) { return it.cat === c; }).length;
  }

  function catExists(name, skipIndex) {
    return cats.some(function (c, i) {
      return i !== skipIndex && c.toLowerCase() === name.toLowerCase();
    });
  }

  // ---------- Manage categories ----------
  function openCats() {
    renderCats();
    document.getElementById('catOverlay').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeCats() {
    document.getElementById('catOverlay').style.display = 'none';
    document.body.style.overflow = '';
  }

  function renderCats() {
    var box = document.getElementById('catList');
    if (cats.length === 0) {
      box.innerHTML = '<div class="empty">No categories yet. Add one below.</div>';
      return;
    }
    box.innerHTML = cats.map(function (c, i) {
      return '<div class="catrow"><span>' + esc(c) + ' <small>(' + countIn(c) + ')</small></span>' +
        '<button onclick="renameCat(' + i + ')">Rename</button>' +
        '<button class="red" onclick="deleteCat(' + i + ')">Delete</button></div>';
    }).join('');
  }

  function addCategory() {
    var inp = document.getElementById('newCat');
    var n = inp.value.trim();
    if (!n) { return; }
    if (catExists(n, -1)) { alert('That category already exists.'); return; }
    cats.push(n);
    inp.value = '';
    save(); refreshCatSelects(); renderCats(); render();
  }

  function renameCat(i) {
    var old = cats[i];
    var n = prompt('Rename category', old);
    if (n === null) { return; }
    n = n.trim();
    if (!n || n === old) { return; }
    if (catExists(n, i)) { alert('That category already exists.'); return; }
    var filterWas = document.getElementById('catFilter').value;
    cats[i] = n;
    items.forEach(function (it) { if (it.cat === old) { it.cat = n; } });
    save(); refreshCatSelects();
    if (filterWas === old) { document.getElementById('catFilter').value = n; }
    renderCats(); render();
  }

  function deleteCat(i) {
    var c = cats[i];
    var count = countIn(c);
    var msg = 'Delete "' + c + '"?' + (count ? ' ' + count + ' item(s) will become uncategorized.' : '');
    if (!confirm(msg)) { return; }
    cats.splice(i, 1);
    items.forEach(function (it) { if (it.cat === c) { it.cat = ''; } });
    save(); refreshCatSelects(); renderCats(); render();
  }

  function restoreDefaults() {
    DEFAULT_CATS.forEach(function (c) {
      if (!catExists(c, -1)) { cats.push(c); }
    });
    save(); refreshCatSelects(); renderCats(); render();
  }

  // ---------- Items ----------
  function addItem() {
    var n = document.getElementById('name').value.trim();
    var q = parseInt(document.getElementById('qty').value, 10);
    var m = parseInt(document.getElementById('minq').value, 10);
    var u = document.getElementById('unit').value;
    var c = document.getElementById('cat').value;
    var x = document.getElementById('exp').value;
    var nt = document.getElementById('notes').value.trim();
    if (!n) { return; }
    if (isNaN(q) || q < 0) { q = 1; }
    if (isNaN(m) || m < 0) { m = 0; }
    items.push({ id: Date.now(), name: n, qty: q, unit: u, cat: c, min: m, exp: x, notes: nt, img: '' });
    document.getElementById('name').value = '';
    document.getElementById('qty').value = '';
    document.getElementById('minq').value = '';
    document.getElementById('unit').value = '';
    document.getElementById('cat').value = '';
    document.getElementById('exp').value = '';
    document.getElementById('notes').value = '';
    save(); render();
  }

  function change(id, d) {
    items.forEach(function (it) {
      if (it.id === id) { it.qty = Math.max(0, it.qty + d); }
    });
    save(); render();
  }

  function removeItem(id) {
    if (!confirm('Delete this item?')) { return; }
    items = items.filter(function (it) { return it.id !== id; });
    save(); render();
  }

  // ---------- Editing ----------
  function openEdit(id) {
    var it = items.filter(function (x) { return x.id === id; })[0];
    if (!it) { return; }
    editingId = id;
    document.getElementById('eName').value = it.name;
    document.getElementById('eQty').value = it.qty;
    document.getElementById('eUnit').value = it.unit || '';
    document.getElementById('eCat').value = it.cat || '';
    document.getElementById('eMin').value = it.min || 0;
    document.getElementById('eExp').value = it.exp || '';
    document.getElementById('eNotes').value = it.notes || '';
    document.getElementById('editOverlay').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeEdit() {
    editingId = null;
    document.getElementById('editOverlay').style.display = 'none';
    document.body.style.overflow = '';
  }

  function saveEdit() {
    var n = document.getElementById('eName').value.trim();
    if (!n) { alert('The item needs a name.'); return; }
    var q = parseInt(document.getElementById('eQty').value, 10);
    var m = parseInt(document.getElementById('eMin').value, 10);
    if (isNaN(q) || q < 0) { q = 0; }
    if (isNaN(m) || m < 0) { m = 0; }
    items.forEach(function (it) {
      if (it.id === editingId) {
        it.name = n;
        it.qty = q;
        it.unit = document.getElementById('eUnit').value;
        it.cat = document.getElementById('eCat').value;
        it.min = m;
        it.exp = document.getElementById('eExp').value;
        it.notes = document.getElementById('eNotes').value.trim();
      }
    });
    save(); closeEdit(); render();
  }

  // ---------- Photos ----------
  function pickImage(id) {
    pickingFor = id;
    document.getElementById('filePicker').click();
  }

  document.getElementById('filePicker').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file || pickingFor === null) { return; }
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas');
        var s = 150 / Math.max(img.width, img.height);
        c.width = img.width * s; c.height = img.height * s;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var data = c.toDataURL('image/jpeg', 0.7);
        items.forEach(function (it) { if (it.id === pickingFor) { it.img = data; } });
        save(); render();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  // ---------- Backup ----------
  function exportData() {
    var blob = new Blob([JSON.stringify({ items: items, categories: cats })], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pantry-backup.json';
    a.click();
  }

  document.getElementById('importPicker').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) { return; }
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var data = JSON.parse(ev.target.result);
        var list = Array.isArray(data) ? data : data.items;
        if (!Array.isArray(list)) { throw new Error('bad'); }
        var newCats = (!Array.isArray(data) && Array.isArray(data.categories)) ? data.categories : cats;
        if (!confirm('Replace your current list with this backup?')) { return; }
        items = list;
        cats = newCats.slice();
        syncCats();
        save(); refreshCatSelects(); render();
      } catch (err) {
        alert('That file could not be read as a pantry backup.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ---------- Display ----------
  function render() {
    updateAlert();
    var term = document.getElementById('search').value.toLowerCase();
    var catSel = document.getElementById('catFilter').value;
    var lowOnly = document.getElementById('lowOnly').checked;
    var expOnly = document.getElementById('expOnly').checked;
    var list = document.getElementById('list');
    var shown = items.filter(function (it) {
      var text = (it.name + ' ' + (it.notes || '')).toLowerCase();
      var matches = text.indexOf(term) !== -1;
      var catOk = !catSel || it.cat === catSel;
      var isLow = it.qty === 0 || (it.min > 0 && it.qty <= it.min);
      var isExp = !!it.exp && daysLeft(it.exp) <= 30;
      return matches && catOk && (!lowOnly || isLow) && (!expOnly || isExp);
    });
    if (shown.length === 0) {
      list.innerHTML = '<div class="empty">No items to show. Add your first one above.</div>';
      return;
    }
    list.innerHTML = shown.map(function (it) {
      var thumb = it.img ? '<img src="' + it.img + '">' : '&#128247;';
      var cls = 'item';
      var warn = '';
      var ex = expiryInfo(it);
      if (ex && ex.cls === 'red') { cls += ' expired'; }
      else if (ex && ex.cls === 'orange') { cls += ' soon'; }
      if (it.qty === 0) { cls += ' out'; warn = '<div class="warn out">Out of stock</div>'; }
      else if (it.min > 0 && it.qty <= it.min) { cls += ' lowstock'; warn = '<div class="warn low">Running low</div>'; }
      var bits = [];
      if (it.cat) { bits.push(it.cat); }
      if (it.unit) { bits.push(it.unit); }
      if (it.min > 0) { bits.push('low at ' + it.min); }
      var meta = bits.join(' | ');
      return '<div class="' + cls + '">' +
        '<div class="thumb" onclick="pickImage(' + it.id + ')">' + thumb + '</div>' +
        '<div class="info"><div class="iname">' + esc(it.name) + '</div>' +
        (meta ? '<div class="meta">' + esc(meta) + '</div>' : '') +
        (it.notes ? '<div class="note">' + esc(it.notes) + '</div>' : '') +
        warn +
        (ex ? '<div><span class="pill ' + ex.cls + '">' + esc(ex.text) + '</span></div>' : '') +
        '</div>' +
        '<div class="ctrl">' +
        '<div class="step">' +
        '<button onclick="change(' + it.id + ',-1)">-</button>' +
        '<div class="count">' + it.qty + '</div>' +
        '<button onclick="change(' + it.id + ',1)">+</button>' +
        '</div>' +
        '<div class="acts">' +
        '<button class="edit" onclick="openEdit(' + it.id + ')">&#9998;</button>' +
        '<button class="del" onclick="removeItem(' + it.id + ')">&#10006;</button>' +
        '</div></div></div>';
    }).join('');
  }

  refreshCatSelects();
  render();
</script>
</body>
</html>
